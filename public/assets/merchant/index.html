<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdgePay Merchant Operations Console</title>
  <!-- Authentic Sanzo Wada Natural Harmony & Editorial Typography Stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <style>
    :root {
      --ink: #12181F; --muted: #5B6470; --paper: #EEF1EA; --surface: #FFFFFF;
      --line: #D8DCD2; --line-light: #ECEEE8; --accent: #C97F1E; --accent-soft: #FBF3E6;
      --teal-bg: #DCEEE8; --teal-text: #0B6E5C; --marigold-bg: #F3E3C7; --marigold-text: #8A5A0F;
      --rust-bg: #F7D7D4; --rust-text: #9E2A2B; --gray-bg: #EAECE6; --gray-text: #5B6470;
      --bkash: #D6296B; --nagad: #EA7A1C; --rocket: #6D3FA0; --card: #3A424B;
      --font-sans: 'Public Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .epx-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="merchant-island" data-api-origin="">
    <!-- Semantic Astro Island Shell: Hydrates dynamically with live D1 database telemetry -->
    <div class="app-shell" style="display: flex; min-height: 100vh;">
      <aside class="app-sidebar" style="width: 220px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #D8DCD2; padding: 22px 14px; display: flex; flex-direction: column; gap: 4px;">
        <div class="app-sidebar__brand" style="font-weight: 700; font-size: 16px; padding: 0 10px 20px; line-height: 1.3;">
          EdgePay Merchant
          <small style="font-size: 11px; font-weight: 400; color: #5B6470; display: block; margin-top: 2px;">Operations Console</small>
        </div>
      </aside>
      <main class="app-main" style="flex: 1; padding: 28px 32px;">
        <div class="page-head" style="margin-bottom: 22px;">
          <h2 style="font-size: 20px; font-weight: 700; margin: 0;">Dashboard</h2>
          <p style="font-size: 13px; color: #5B6470; margin-top: 3px;">Live ledger volume and transaction activity from Cloudflare D1</p>
        </div>
        <div class="stat-row" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px;">
          <div class="stat-card" style="background: #FFF; border: 1px solid #D8DCD2; border-radius: 10px; padding: 16px 18px;">
            <div style="font-size: 12px; color: #5B6470; margin-bottom: 6px;">Today's volume</div>
            <div class="epx-mono" style="font-size: 22px; font-weight: 600;">৳0.00</div>
          </div>
          <div class="stat-card" style="background: #FFF; border: 1px solid #D8DCD2; border-radius: 10px; padding: 16px 18px;">
            <div style="font-size: 12px; color: #5B6470; margin-bottom: 6px;">Transactions</div>
            <div class="epx-mono" style="font-size: 22px; font-weight: 600;">0</div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="/assets/scripts/merchant-island.js"></script>
</body>
</html>
