<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdgePay Admin — Platform Operations & Tenant Management</title>
  <!-- Authentic Sanzo Wada Natural Harmony & Editorial Typography Stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <style>
    :root {
      --ink: #12181F; --muted: #5B6470; --paper: #EEF1EA; --surface: #FFFFFF;
      --line: #D8DCD2; --line-light: #ECEEE8; --accent: #C97F1E; --accent-soft: #FBF3E6;
      --teal-bg: #DCEEE8; --teal-text: #0B6E5C; --marigold-bg: #F3E3C7; --marigold-text: #8A5A0F;
      --rust-bg: #F7D7D4; --rust-text: #9E2A2B; --gray-bg: #EAECE6; --gray-text: #5B6470;
      --bkash: #D6296B; --nagad: #EA7A1C; --rocket: #6D3FA0; --card: #3A424B;
      --font-sans: 'Public Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .epx-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="admin-island" data-api-origin="">
    <!-- Semantic Astro Island Shell: Hydrates dynamically with live D1 platform registry -->
    <div class="app-shell" style="display: flex; min-height: 100vh;">
      <aside class="app-sidebar" style="width: 220px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #D8DCD2; padding: 22px 14px;">
        <div class="app-sidebar__brand" style="font-weight: 700; font-size: 16px;">
          EdgePay Admin
          <small style="font-size: 11px; font-weight: 400; color: #5B6470; display: block; margin-top: 2px;">Platform Operations Console</small>
        </div>
      </aside>
      <main class="app-main" style="flex: 1; padding: 28px 32px;">
        <div class="page-head" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px;">
          <div>
            <h2 style="font-size: 20px; font-weight: 700; margin: 0;">Merchants</h2>
            <p style="font-size: 13px; color: #5B6470; margin-top: 3px;">Provision merchant tenants and manage cryptographic onboarding claim tokens</p>
          </div>
          <button id="btn-adm-provision" class="btn btn--accent" style="background: #C97F1E; color: #FFF8EE; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;">＋ Provision merchant</button>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="/assets/scripts/admin-island.js"></script>
</body>
</html>
