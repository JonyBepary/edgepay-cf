name: Gitleaks secret scan (P0-4)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gitleaks:
    name: Detect committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Block known secret variable names with live values
        run: |
          set -eu
          echo "Scanning tracked files for live JWT_SECRET / APP_KEY / ENCRYPTION_KEY assignments..."
          # Match only when RHS is a bare hex/base64 literal (40+ chars), not a variable or template.
          # Placeholders (YOUR_*, EXAMPLE, CHANGEME, *** ) are allowed.
          if git grep -n -P '(JWT_SECRET|APP_KEY|ENCRYPTION_KEY)\s*[:=]\s*["'"'"']?[A-Za-z0-9+/=]{40,}["'"'"']?[;,]?\s*$' -- \
            ':!*.md' \
            ':!package.json' \
            ':!gitleaks.yml' \
            ':!packages/init/**' \
            ':!scripts/**' \
            ':!src/types/**' \
            ':!src/lib/secrets-guard.ts' \
            ':!src/lib/jwt.ts' \
            ':!tests/**' \
            ':!vitest.config.ts' | \
            grep -v -E 'YOUR_|EXAMPLE|CHANGEME|\*\*\*|YOUR-32|HERE' ; then
            echo "::error::Live secret assignment detected (JWT_SECRET|APP_KEY|ENCRYPTION_KEY). Use \`wrangler secret put <NAME>\` and remove the value from the repo."
            exit 1
          fi
          echo "No live secret assignments found."
