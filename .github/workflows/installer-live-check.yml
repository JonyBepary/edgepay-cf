name: Installer Live Verification

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/init/**'
      - '.github/workflows/installer-live-check.yml'

concurrency:
  group: installer-live-check
  cancel-in-progress: false

jobs:
  live-verify:
    name: Destroy & Install Live Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EDGEPAY_SCRATCH_ACCOUNTS: ${{ secrets.EDGEPAY_SCRATCH_ACCOUNTS || secrets.CLOUDFLARE_ACCOUNT_ID }}
      EDGEPAY_DESTROY_CONFIRMED: yes
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build installer package
        run: npm run build:init

      - name: Pre-run Teardown (Clean Slate)
        run: |
          echo "Executing pre-run cleanup in case previous run left lingering resources..."
          node packages/init/bin/edgepay-init.mjs --destroy --name=edgepay-fresh --i-know-what-im-doing --yes || true

      - name: Execute Fresh Installation (Timed)
        id: install
        run: |
          echo "Starting fresh EdgePay installation..."
          START_TIME=$(date +%s)
          node packages/init/bin/edgepay-init.mjs --yes \
            --name=edgepay-fresh \
            --currency=BDT \
            --merchant="CI Automated Verification"
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "Installation completed in ${DURATION} seconds."
          if [ "$DURATION" -gt 300 ]; then
            echo "ERROR: Installation took ${DURATION}s, exceeding maximum allowed 300s budget."
            exit 1
          fi

      - name: Verify Health Check & Subsystems
        run: |
          WORKER_URL="https://edgepay-fresh.bm-jonybepary.workers.dev"
          echo "Probing primary health check: ${WORKER_URL}/api/v1/health"
          PRIMARY_RES=$(curl -sS --retry 3 --retry-delay 2 "${WORKER_URL}/api/v1/health")
          echo "Primary Health Response: ${PRIMARY_RES}"

          echo "Probing alias health check: ${WORKER_URL}/health"
          ALIAS_RES=$(curl -sS --retry 3 --retry-delay 2 "${WORKER_URL}/health")
          echo "Alias Health Response: ${ALIAS_RES}"

          # Assert JSON success and status ok
          echo "${PRIMARY_RES}" | grep -q '"success":true' || (echo "Failed: success is not true"; exit 1)
          echo "${PRIMARY_RES}" | grep -q '"status":"ok"' || (echo "Failed: status is not ok"; exit 1)

          # Assert critical subsystems
          echo "${PRIMARY_RES}" | grep -q '"durable_objects":true' || (echo "Failed: durable_objects is not true"; exit 1)
          echo "${PRIMARY_RES}" | grep -q '"workflows":true' || (echo "Failed: workflows is not true"; exit 1)
          echo "${PRIMARY_RES}" | grep -q '"workers_ai":true' || (echo "Failed: workers_ai is not true"; exit 1)

          echo "Probing merchant dashboard: ${WORKER_URL}/merchant"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${WORKER_URL}/merchant")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed: /merchant returned HTTP ${HTTP_CODE} instead of 200"
            exit 1
          fi

          echo "All live health and subsystem probes passed!"

      - name: Post-run Teardown & Resource Isolation
        if: always()
        run: |
          echo "Executing post-run cleanup to leave zero remote resources..."
          node packages/init/bin/edgepay-init.mjs --destroy --name=edgepay-fresh --i-know-what-im-doing --yes || true
